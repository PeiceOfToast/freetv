name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, proxy]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      - name: Test
        if: matrix.app != 'web'
        run: npm test --if-present
      - name: Build
        # The web app has no test suite; its build also runs the TypeScript check.
        if: matrix.app == 'web'
        run: npm run build

  infra:
    name: compose and caddy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Caddyfile copies match
        run: diff -u infra/caddy/Caddyfile apps/web/Caddyfile
      - name: Validate Caddyfile
        run: >
          docker run --rm -e SITE_ADDRESS=:80
          -v "$PWD/infra/caddy:/etc/caddy:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  images:
    name: image ${{ matrix.service }}
    needs: [app, infra]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, proxy, epg]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/freetv-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build (and push on main or tags)
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/proxy/package-lock.json
            e2e/package-lock.json
      - name: Install api, web, proxy and e2e
        run: |
          (cd apps/api && npm ci)
          (cd apps/web && npm ci)
          (cd apps/proxy && npm ci)
          (cd e2e && npm ci)
      - name: Build web
        run: npm run build
        working-directory: apps/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Fully offline: the api gets a fixture catalog and a fake HLS origin on loopback.
      - name: Run e2e
        run: npm test
        working-directory: e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/test-results
          retention-days: 7
