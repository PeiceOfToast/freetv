# Loads the dashboard JSON from /var/lib/grafana/dashboards (bind mount of infra/monitoring/grafana/dashboards).
apiVersion: 1

providers:
  - name: freetv
    orgId: 1
    folder: FreeTV
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
