{{- $api := include "freetv.component" (dict "root" . "name" "api") }}
{{- $web := include "freetv.component" (dict "root" . "name" "web") }}
{{- $proxy := include "freetv.component" (dict "root" . "name" "proxy") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "freetv.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ required "domain is required: it is the Ingress host" .Values.domain | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ required "domain is required: it is the Ingress host" .Values.domain | quote }}
      http:
        paths:
          # Caddy's /api and /proxy routes are bypassed here, so these must match the api and proxy paths.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  number: 3000
          - path: /logo
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  number: 3000
          {{- if .Values.proxy.enabled }}
          - path: {{ .Values.proxy.env.PROXY_PUBLIC_PATH }}
            pathType: Prefix
            backend:
              service:
                name: {{ $proxy }}
                port:
                  number: 3001
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $web }}
                port:
                  number: 80
