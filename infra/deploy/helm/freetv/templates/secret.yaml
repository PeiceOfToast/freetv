{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freetv.secretName" . }}
  labels:
    {{- include "freetv.labels" . | nindent 4 }}
type: Opaque
stringData:
  PROXY_SECRET: {{ required "secrets.proxySecret is required (or set secrets.existingSecret). Generate with: openssl rand -hex 32" .Values.secrets.proxySecret | quote }}
  ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
{{- end }}
