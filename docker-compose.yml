# FreeTV stack. Copy .env.example to .env first (docker compose reads it for interpolation
# and for COMPOSE_PROFILES). Start: `docker compose up -d`.
#
# Images: each service is built from apps/<svc> and tagged ghcr.io/<owner>/freetv-<svc>:<tag>.
# <owner> is GITHUB_REPOSITORY_OWNER from .env. When that is empty the owner falls back to
# "local", a namespace nothing is published under, so the images can only be built here
# (`docker compose up -d --build`). Set GITHUB_REPOSITORY_OWNER to pull published images
# (`docker compose pull && docker compose up -d`).
#
# Users: the api, proxy and epg images run as the image USER "node" (uid 1000). There is no
# `user:` key here on purpose, so each Dockerfile decides the uid. The data volume must be
# owned by 1000:1000 (docs/TROUBLESHOOTING.md, "EACCES on /data").
#
# Optional profiles (add to COMPOSE_PROFILES in .env):
#   monitoring  Prometheus + Grafana, Grafana on 127.0.0.1:3002 only. docs/DEPLOY.md "Monitoring".
#   autoupdate  Watchtower, pulls new GHCR images daily. docs/DEPLOY.md "Automatic updates".
name: freetv

# Log rotation for every container, profiles included. Without it json-file grows without limit.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Services labelled with this are the only ones Watchtower (profile autoupdate) may restart.
x-watchtower-labels: &watchtower-labels
  com.centurylinklabs.watchtower.enable: "true"

services:
  web:
    build:
      context: ./apps/web
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/freetv-web:${FREETV_TAG:-latest}
    restart: unless-stopped
    labels: *watchtower-labels
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-}
      # Caddy site address: the domain (automatic HTTPS) or plain HTTP on :80.
      SITE_ADDRESS: ${DOMAIN:-:80}
    volumes:
      # Directory mount (not a single file) so `git pull` edits are seen without a rebuild.
      - ./infra/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/freetv-api:${FREETV_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-1g}
    labels: *watchtower-labels
    logging: *logging
    environment:
      IPTV_API_BASE: ${IPTV_API_BASE:-https://iptv-org.github.io/api}
      INGEST_INTERVAL_HOURS: ${INGEST_INTERVAL_HOURS:-6}
      HIDE_NSFW_DEFAULT: ${HIDE_NSFW_DEFAULT:-true}
      PROXY_ENABLED: ${PROXY_ENABLED:-true}
      PROXY_SECRET: ${PROXY_SECRET:?Set PROXY_SECRET in .env (run infra/scripts/gen-secret.sh)}
      PROXY_PUBLIC_PATH: ${PROXY_PUBLIC_PATH:-/proxy}
      # Signed relay URLs expire after these many seconds (channel pages / M3U exports).
      # Empty = the api's built-in default. See .env.example.
      PROXY_URL_TTL_SECONDS: ${PROXY_URL_TTL_SECONDS:-}
      PROXY_EXPORT_TTL_SECONDS: ${PROXY_EXPORT_TTL_SECONDS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      EPG_FILE: /data/epg/guide.xml
      EPG_POLL_SECONDS: ${EPG_POLL_SECONDS:-60}
      # Stream health prober
      PROBE_ENABLED: ${PROBE_ENABLED:-true}
      PROBE_INTERVAL_HOURS: ${PROBE_INTERVAL_HOURS:-6}
      PROBE_CONCURRENCY: ${PROBE_CONCURRENCY:-8}
      PROBE_RATE_PER_SECOND: ${PROBE_RATE_PER_SECOND:-5}
      PROBE_TIMEOUT_MS: ${PROBE_TIMEOUT_MS:-10000}
      # Logo cache. Explicit defaults: an empty string would not fall back inside the api.
      LOGO_CACHE_ENABLED: ${LOGO_CACHE_ENABLED:-true}
      LOGO_CACHE_DIR: ${LOGO_CACHE_DIR:-/data/logos}
      LOGO_CACHE_MAX_MB: ${LOGO_CACHE_MAX_MB:-500}
      LOGO_MAX_SIZE: ${LOGO_MAX_SIZE:-512}
      # Operator blocklist (JSON array of channel ids). See infra/scripts/block-channel.sh.
      LOCAL_BLOCKLIST: ${LOCAL_BLOCKLIST:-/data/local-blocklist.json}
    volumes:
      - data:/data

  proxy:
    profiles: ["proxy"]
    build:
      context: ./apps/proxy
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/freetv-proxy:${FREETV_TAG:-latest}
    restart: unless-stopped
    labels: *watchtower-labels
    logging: *logging
    environment:
      PROXY_SECRET: ${PROXY_SECRET:?Set PROXY_SECRET in .env (run infra/scripts/gen-secret.sh)}
      PROXY_PUBLIC_PATH: ${PROXY_PUBLIC_PATH:-/proxy}
      PROXY_MAX_CONCURRENT: ${PROXY_MAX_CONCURRENT:-200}
      PROXY_MAX_BYTES: ${PROXY_MAX_BYTES:-52428800}
      # Relay limits. The client IP comes from X-Forwarded-For set by Caddy; the proxy port is
      # not published, so nothing else can reach it to spoof that header.
      PROXY_RATE_LIMIT_RPS: ${PROXY_RATE_LIMIT_RPS:-20}
      PROXY_RATE_LIMIT_BURST: ${PROXY_RATE_LIMIT_BURST:-60}
      PROXY_MAX_CONCURRENT_PER_IP: ${PROXY_MAX_CONCURRENT_PER_IP:-16}
      PROXY_TRUST_PROXY: ${PROXY_TRUST_PROXY:-true}
      # Dev only (targets on private ranges). Keep false on any internet-facing instance.
      PROXY_ALLOW_PRIVATE: ${PROXY_ALLOW_PRIVATE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-warn}

  epg:
    profiles: ["epg"]
    build:
      context: ./apps/epg
      args:
        # iptv-org/epg commit the grabber is built from. Same value as the default in
        # apps/epg/Dockerfile and .env.example; see docs/notes/review-fixes-d.md to bump it.
        EPG_REF: ${EPG_REF:-8c23cfe7396724ee5297f370415fc04d6fda058c}
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/freetv-epg:${FREETV_TAG:-latest}
    restart: unless-stopped
    # The grabber holds several hundred thousand programmes in memory before its XML write, so
    # EPG_SITES=all may need more than 2 GB (unverified). 4 GB is the limit here. On a smaller host,
    # narrow EPG_SITES or set EPG_SPLIT_BY_SITE=true.
    mem_limit: ${EPG_MEM_LIMIT:-4g}
    cpus: 2
    labels: *watchtower-labels
    logging: *logging
    environment:
      # V8 sizes its heap from the host's RAM, not the cgroup limit, so cap it below mem_limit or the
      # kernel OOM-kills the grabber mid-run instead of Node failing cleanly. Keep ~25% headroom.
      NODE_OPTIONS: ${EPG_NODE_OPTIONS:---max-old-space-size=3072}
      IPTV_API_BASE: ${IPTV_API_BASE:-https://iptv-org.github.io/api}
      EPG_SITES: ${EPG_SITES:-all}
      EPG_EXCLUDE_SITES: ${EPG_EXCLUDE_SITES:-}
      EPG_ONE_SITE_PER_CHANNEL: ${EPG_ONE_SITE_PER_CHANNEL:-true}
      EPG_DAYS: ${EPG_DAYS:-2}
      EPG_MAX_CONNECTIONS: ${EPG_MAX_CONNECTIONS:-10}
      EPG_TIMEOUT_MS: ${EPG_TIMEOUT_MS:-30000}
      EPG_GRAB_ARGS: ${EPG_GRAB_ARGS:-}
      EPG_SPLIT_BY_SITE: ${EPG_SPLIT_BY_SITE:-false}
      EPG_REFRESH_API_DATA: ${EPG_REFRESH_API_DATA:-true}
      EPG_INTERVAL_HOURS: ${EPG_INTERVAL_HOURS:-12}
      EPG_RUN_ON_START: ${EPG_RUN_ON_START:-true}
      EPG_OUTPUT: /data/epg/guide.xml
    volumes:
      - data:/data

  # ---- profile: monitoring ---------------------------------------------------
  # Prometheus scrapes api:3000/metrics and proxy:3001/metrics on the compose network.
  # Neither port is published and Caddy does not route /metrics, so Prometheus has no public
  # endpoint. Grafana is bound to loopback: reach it with `ssh -L 3002:127.0.0.1:3002 host`.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Placeholder default on purpose: compose interpolates every service even when its profile is off, so a
      # hard `:?` here would break the default stack. update.sh refuses to run with the placeholder when monitoring is on.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  # ---- profile: autoupdate ---------------------------------------------------
  # Watchtower polls GHCR once a day and recreates only containers carrying the label above.
  # It can only update images that are pulled from a registry. Services built with --build are
  # ignored or replaced by whatever GHCR has. Use infra/auto-update/ (systemd timer) for those.
  # Watchtower gets the Docker socket, which is root on the host. Keep this profile opt-in.
  # Pinned to a tag, not :latest. containrrr/watchtower 1.7.1 is the long-standing upstream release; it
  # is no longer maintained and may fail against newer Docker Engine API minimums. Check it on the host
  # before relying on it (docs/DEPLOY.md "Automatic updates").
  watchtower:
    profiles: ["autoupdate"]
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    logging: *logging
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 4 * * *} # 6-field cron (seconds first): 04:00 daily
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
